version: 2

# One pull request a week updates every ecosystem at once (Go, Bun, Docker, GitHub Actions, Gradle): a single
# CI run and a single review. The commit message keeps the repository's Conventional Commits style; `build` does
# not start a release by itself.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: gomod
    directories: [/apps/server, /apps/desktop]
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: bun
    directories: [/apps/client, /apps/website]
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /docker
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: gradle
    directory: /apps/android
    patterns: ["*"]
    multi-ecosystem-group: dependencies
