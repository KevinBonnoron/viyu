name: CI

# Checks a pull request before it reaches main: lint, tests and the builds that could break (web UI, Go,
# Docker image for amd64, Android APK, docs). It publishes nothing: a push to main runs release-please.yml
# only, and release.yml builds and publishes a release from its tag.
on:
  pull_request:
    branches: [main]

# Least privilege: nothing here writes.
permissions:
  contents: read

# A newer push to the same pull request supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  # Decides which jobs are relevant from the changed paths. Uses plain `git diff`
  # (no third-party action, no secrets), so it works for fork PRs.
  #
  #   area             paths                                                 jobs
  #   client           apps/client/                                          Web UI (build + tests), Lint (web)
  #   server           apps/server/                                          Go (server), Docker
  #   desktop          apps/desktop/                                         Go (desktop)
  #   android          apps/android/                                         Android
  #   docker           docker/, .dockerignore                                Docker
  #   docs             apps/website/, docs/                                  Docs, Lint (web)
  #   deps             lockfiles, package.json, go.mod/go.sum, flake          Audit
  #   everything       .github/, flake, tooling files, or any path not      all of the above
  #                    listed here (README, LICENSE... trigger nothing)
  #   release files    VERSION, CHANGELOG.md, .release-please-manifest.json nothing (the release pull request)
  #
  # Skipped jobs count as passed for the required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      lint-web: ${{ steps.filter.outputs.lint-web }}
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute changed areas
        id: filter
        run: |
          set -euo pipefail
          client=false server=false desktop=false android=false
          docker=false docs=false deps=false everything=false

          # HEAD is the merge commit: its first parent is the current base tip.
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files:"
          echo "$files"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" =~ (^|/)(bun\.lock|package\.json|go\.mod|go\.sum)$ || "$file" =~ ^flake\.(nix|lock)$ ]]; then
              deps=true
            fi
            case "$file" in
              apps/client/*) client=true ;;
              apps/server/*) server=true ;;
              apps/desktop/*) desktop=true ;;
              apps/android/*) android=true ;;
              docker/* | .dockerignore) docker=true ;;
              apps/website/* | docs/*) docs=true ;;
              README.md | LICENSE | AGENTS.md | CLAUDE.md | .gitignore | .envrc) ;;
              # Only release-please writes these, in the release pull request; the code was checked already.
              VERSION | CHANGELOG.md | .release-please-manifest.json) ;;
              *) everything=true ;;
            esac
          done <<< "$files"

          if [[ "$everything" == true ]]; then
            client=true server=true desktop=true android=true docker=true docs=true deps=true
          fi

          go=false
          if [[ "$server" == true || "$desktop" == true ]]; then go=true; fi
          lint_web=false
          if [[ "$client" == true || "$docs" == true ]]; then lint_web=true; fi
          # The image embeds the server: its recipe or the server changing rebuilds it.
          if [[ "$server" == true ]]; then docker=true; fi
          # The UI artifacts are embedded by the Go packages, the image and the APK.
          ui=false
          if [[ "$client" == true || "$go" == true || "$android" == true || "$docker" == true ]]; then ui=true; fi

          {
            echo "client=$client"
            echo "server=$server"
            echo "desktop=$desktop"
            echo "android=$android"
            echo "docker=$docker"
            echo "docs=$docs"
            echo "lint-web=$lint_web"
            echo "go=$go"
            echo "ui=$ui"
            echo "audit=$deps"
          } | tee -a "$GITHUB_OUTPUT"

  # Builds both web UIs once (server/Android: `dist`; desktop shell with
  # VITE_CLIENT_TARGET=desktop: `dist-desktop`); every downstream job consumes the artifacts.
  # The UI tests run only when the client changed.
  ui:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: apps/client
        run: bun install --frozen-lockfile
      - name: Build web UI
        run: bun run --cwd apps/client build
      - name: Build desktop UI
        run: bun run --cwd apps/client build:desktop
      - name: Test UI
        if: needs.changes.outputs.client == 'true'
        run: bun run --cwd apps/client test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui
          path: apps/client/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-ui
          path: apps/client/dist-desktop
          if-no-files-found: error

  # Biome (client, docs and the JSON/config files) and version consistency. Biome comes from
  # the Nix devshell, pinned to the version biome.json is written for.
  lint-web:
    name: Lint (web)
    needs: changes
    if: needs.changes.outputs.lint-web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - name: Biome
        run: nix develop --command biome ci .
      - name: Version consistency
        run: nix develop --command bun scripts/check-version.ts

  # Dependency audits, when dependencies change. They query vulnerability databases that change on
  # their own, so release.yml also runs them every week on the latest release.
  audit:
    name: Audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - name: Audit dependencies
        run: nix develop --command ./scripts/audit.sh

  # Every Go module in one job, so the Nix devshell (Go, GTK4/WebKitGTK, Tesseract) is set up
  # once: gofmt, go vet and tests for the modules that changed. The Go packages embed the UI, so
  # the prebuilt artifacts are placed in the embed directories first.
  go:
    name: Go
    needs: [changes, ui]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      SERVER: ${{ needs.changes.outputs.server }}
      DESKTOP: ${{ needs.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      # The devshell builds Go itself when it overrides the nixpkgs version; the store cache keeps
      # that (and the GTK/WebKit closure) between runs. A pull request can only read caches saved on
      # main: release.yml's weekly run saves them there.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('flake.lock', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: apps/server/internal/ui/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-ui
          path: apps/desktop/dist
      - name: Prepare devshell
        run: nix develop --command go version
      - name: gofmt
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell
          nix develop --command sh -ec '
            unformatted="$(gofmt -l apps/server apps/desktop)"
            if [ -n "$unformatted" ]; then
              echo "Files need gofmt:"
              echo "$unformatted"
              exit 1
            fi
          '
      - name: Server (vet, tests with the race detector, build without CGO)
        if: env.SERVER == 'true'
        run: |
          nix develop --command sh -ec '
            cd apps/server
            go vet ./... && go vet -tags ocr ./...
            go test -race -tags ocr -p 1 ./...
            CGO_ENABLED=0 go build ./...
          '
      - name: Desktop shell (vet, tests)
        if: env.DESKTOP == 'true'
        run: nix develop --command sh -ec 'cd apps/desktop && go vet ./... && go test ./...'

  # The Capacitor Android client builds: versionName/versionCode come from the VERSION file. The APK
  # itself is published by release.yml.
  android:
    name: Android (debug APK)
    needs: [changes, ui]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: apps/client/dist
      - name: Install dependencies
        working-directory: apps/client
        run: bun install --frozen-lockfile
      # `cap sync` only copies apps/client/dist and the plugins into the
      # Android project; it does not rebuild the frontend.
      - name: Sync Capacitor
        run: bun run --cwd apps/client cap:sync:android
      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

  # The image builds for amd64, with the UI injected from the prebuilt artifact; nothing is pushed.
  # It does not wait for the tests: it only proves the recipe still builds.
  docker:
    name: Docker
    needs: [changes, ui]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: .ci/ui
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            UI_BUILD=frontend-prebuilt
          push: false
          platforms: linux/amd64
          # Reads the layers release.yml's weekly run caches on main; pull requests do not write any.
          cache-from: type=gha,scope=linux-amd64

  # The desktop shell builds for every platform a release ships: Linux against the system GTK4/WebKitGTK,
  # Windows cross-compiled, macOS on a macOS runner. Only the build is checked: the Go job tests the shell.
  desktop:
    name: Desktop (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: windows
            runner: ubuntu-24.04
          - target: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK4 and WebKitGTK
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The workspace sets the Go version every module builds with.
          go-version-file: go.work
          cache-dependency-path: apps/desktop/go.sum
      - name: Build
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The embedded UI only has to exist for the build.
          mkdir -p dist && touch dist/index.html
          case "$TARGET" in
            linux | macos) CGO_ENABLED=1 go build -o /dev/null . ;;
            windows) CGO_ENABLED=0 GOOS=windows go build -ldflags="-H windowsgui" -o /dev/null . ;;
          esac

  # Always builds the docs when relevant to catch breakage; release.yml deploys them.
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: apps/website
        run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run --cwd apps/website build
